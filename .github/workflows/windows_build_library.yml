name: Build Xash3D FWGS 64-bit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Ставимо все необхідне: Python, GCC/MinGW, SDL2 та pkg-config
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config
            git

      - name: Configure Waf
        run: |
          # Використовуємо саме python з MSYS2
          python3 waf configure --build-type=release --64bits

      - name: Build
        run: |
          python3 waf build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-fwgs-win64
          # Збираємо всі скомпільовані exe та dll
          path: |
            build/*.exe
            build/*.dll
            build/**/*.dll
