name: Build Xash3D FWGS 64-bit (MSVC)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and Setup SDL2 for MSVC
        shell: pwsh
        run: |
          # Завантажуємо офіційну версію SDL2 для розробки під Visual Studio
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip" -OutFile "SDL2.zip"
          Expand-Archive -Path "SDL2.zip" -DestinationPath "D:\SDL2"

      - name: Configure Waf
        shell: pwsh
        run: |
          # Вказуємо Waf шлях до розпакованого SDL2
          $SDL2_PATH = "D:\SDL2\SDL2-2.28.5"
          $env:SDL2DIR = $SDL2_PATH
          
          # Запускаємо конфіг. MSVC підтягнеться автоматично.
          python waf configure --build-type=release --64bits --sdl2=$SDL2_PATH

      - name: Show config.log on failure
        if: failure()
        run: cat build/config.log

      - name: Build
        run: python waf build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-fwgs-win64
          path: |
            build/*.exe
            build/*.dll
            build/**/*.dll
