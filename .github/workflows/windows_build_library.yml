name: Build Xash3D 64-bit
on: [push, pull_request]

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SDL2 via vcpkg
        # Нам потрібна x64 версія SDL2 для Windows
        run: |
          vcpkg install sdl2:x64-windows
          vcpkg integrate install

      - name: Configure Waf
        # Вказуємо шлях до vcpkg, щоб Waf знайшов SDL2
        run: |
          $env:CMAKE_TOOLCHAIN_FILE = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          python waf configure --build-type=release --64bits

      - name: Build
        run: python waf build

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-64bit-dlls
          # Збираємо всі скомпільовані ліби
          path: |
            build/**/*.dll
            build/**/*.exe
